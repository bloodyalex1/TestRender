<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIWI - SPA Solicitudes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="landing.js" defer></script>
  </head>
  <body>
    <nav class="navbar custom-nav sticky-top">
      <div class="container-fluid px-4 d-flex justify-content-between">
        <img
          class="navbar-brand"
          src="https://riwi.io/wp-content/uploads/2023/07/Logotipo-Riwi-White.png"
          alt="Logo"
          width="80"
        />

        <div class="d-flex align-items-center gap-4 text-white">
          <i class="bi bi-link-45deg fs-4 cursor-pointer"></i>
          <i class="bi bi-search fs-5 cursor-pointer"></i>
          <i class="bi bi-bell fs-5 cursor-pointer"></i>
          <div class="position-relative">
            <i class="bi bi-chat-left-text fs-5 cursor-pointer"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              style="font-size: 0.5rem"
              >1</span
            >
          </div>
          <div class="d-flex align-items-center gap-2 cursor-pointer">
            <img
              src="https://ui-avatars.com/api/?name=Juan+Esteban&background=random"
              class="rounded-circle border border-2 border-secondary"
              alt="user"
              width="35"
            />
            <i class="bi bi-chevron-down small"></i>
          </div>
        </div>
      </div>
    </nav>

    <main id="main-content" class="container-fluid py-5 px-lg-5"></main>

    <template id="temp-form">
      <div class="row d-flex justify-content-center align-items-start">
        <div class="col-md-7">
          <h2 class="title-purple mb-4 text-center">
            ESCRIBENOS TU SOLICITUD NOVA
          </h2>
          <div class="form-container-dark p-4 shadow-lg">
            <form id="nova-form">
              <select class="form-select custom-input mb-3" id="main-reason">
                <option selected disabled>MOTIVO DE SOLICITUD</option>
                <option value="excusas">Excusas</option>
                <option value="certificados">Certificados</option>
              </select>

              <div id="dynamic-select-container"></div>

              <textarea
                class="form-control custom-input mb-3 text-white-50"
                rows="5"
                placeholder="Describe tu solicitud aquí..."
              ></textarea>

              <div
                id="drop-zone"
                class="upload-area mb-2 align-items-center justify-content-center d-flex flex-column gap-2 cursor-pointer"
              >
                <i class="bi bi-cloud-upload fs-2"></i>
                <p class="mb-0">ADJUNTA TUS ARCHIVOS O SUELTALOS AQUÍ</p>
                <input type="file" id="file-input" class="d-none" multiple />
              </div>

              <div id="file-list" class="d-flex flex-wrap gap-2 mb-4"></div>

              <button type="button" class="btn btn-submit w-100">
                ENVIAR SOLICITUD NOVA
              </button>
            </form>
          </div>
        </div>
        <div class="col-md-4 mt-5 mt-md-0 text-center">
          <h2 class="title-purple mb-3">MIS SOLICITUDES</h2>
          <p class="text-dark">
            Visualiza tus solicitudes creadas clickeando aqui
            <a
              href="#"
              id="link-solicitudes"
              class="fw-bold text-decoration-none"
              style="color: var(--riwi-purple)"
              >hola</a
            >
          </p>
        </div>
      </div>
    </template>

    <template id="temp-list">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="sidebar-dark-custom p-4 shadow-lg">
            <h3 class="fw-bold mb-3">MIS SOLICITUDES (8)</h3>
            <p class="small text-white-50 mb-4">
              En este apartado, podrá consultar el historial y estado de todas
              sus solicitudes académicas y administrativas gestionadas durante
              su proceso de formación en RIWI.
            </p>

            <div class="req-card-white mb-3">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <span class="req-id"
                  ><i class="bi bi-envelope-fill me-2"></i>#162786121</span
                >
                <span class="badge-status-rechazada">RECHAZADA</span>
              </div>
              <p class="req-title">EXCUSA INASISTENCIA</p>
              <small class="req-date">FECHA DE CREACION: 01-01-2026</small>
            </div>

            <div class="req-card-white mb-3">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <span class="req-id"
                  ><i class="bi bi-envelope-fill me-2"></i>#182703984</span
                >
                <span class="badge-status-revision">EN REVISION</span>
              </div>
              <p class="req-title">EXCUSA INASISTENCIA</p>
              <small class="req-date">FECHA DE CREACION: 01-01-2026</small>
            </div>

            <div class="req-card-white mb-3">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <span class="req-id"
                  ><i class="bi bi-envelope-fill me-2"></i>#142793023</span
                >
                <span class="badge-status-aprobada">APROVADA</span>
              </div>
              <p class="req-title">EXCUSA INASISTENCIA</p>
              <small class="req-date">FECHA DE CREACION: 01-01-2026</small>
            </div>

            <div
              class="d-flex justify-content-center align-items-center gap-3 mt-4"
            >
              <i class="bi bi-chevron-left text-white cursor-pointer"></i>
              <span class="page-circle">1</span>
              <span class="page-circle active">2</span>
              <span class="page-circle">3</span>
              <i class="bi bi-chevron-right text-white cursor-pointer"></i>
            </div>

            <button
              class="btn btn-info w-100 mt-4 fw-bold"
              id="btn-volver-form"
              style="
                background-color: #00d4ff;
                border: none;
                border-radius: 10px;
              "
            >
              NUEVA SOLICITUD NOVA
            </button>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="ps-lg-5">
            <div class="mb-5">
              <div class="d-flex align-items-center gap-2 mb-2">
                <img
                  src="https://ui-avatars.com/api/?name=Juan+Esteban&background=random"
                  class="rounded-circle"
                  width="25"
                />
                <small class="text-primary fw-bold"
                  >JUAN ESTEBAN CABRERA PEREZ</small
                >
              </div>
              <div class="detail-card-dark p-4">
                <h5 class="fw-bold border-bottom border-secondary pb-2 mb-3">
                  EXCUSA DE INASISTENCIA:
                </h5>
                <p class="small text-white-50 lh-lg">
                  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed
                  do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                  Ut enim ad minim veniam, quis nostrud exercitation ullamco
                  laboris nisi ut aliquip ex ea commodo consequat. Duis aute
                  irure dolor in reprehenderit in voluptate velit esse cillum
                  dolore eu fugiat nulla pariatur.
                </p>
              </div>
            </div>

            <div class="mt-4">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i class="bi bi-person-fill text-primary"></i>
                <small class="text-primary fw-bold text-uppercase"
                  >Robinson Andres Cortes</small
                >
              </div>
              <div class="detail-card-dark p-4" style="max-width: 80%">
                <h5 class="fw-bold border-bottom border-secondary pb-2 mb-3">
                  EXCUSA NO APROVADA:
                </h5>
                <p class="small text-white-50">
                  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed
                  do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
